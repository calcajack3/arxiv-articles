{% extends "base.html" %}

{% block content %}
{% for article in articles %}
<div class="article">
    <div class="article-title">{{ article.title }}</div>
    <div class="article-summary">{{ article.summary }}</div>
    <a class="article-link" href="{{article.link}}" target="_blank">Link to the full article!</a>
</div>
{% endfor %}
{% endblock %}
